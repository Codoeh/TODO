{% extends "base.html" %}
{% block content %}
	<div class="container mt-4">
		<div class="d-flex justify-content-between align-items-center mb-3">
			<h1>Tags</h1>
			<a href="#" class="btn btn-primary">Add</a>
		</div>
		{% if tag_list %}
			<table class="table">
				<thead>
				<tr>
					<th>Name</th>
					<th>Update</th>
					<th>Delete</th>
				</tr>
				</thead>
				<tbody>
				{% for tag in tag_list %}
					<tr>
						<td>{{ tag.name }}</td>
						<td>
							<a class="btn btn-secondary" href="#">
								Update
							</a>
						</td>
						<td>
							<a class="btn btn-secondary href=" #">
							Delete
							</a>
						</td>
					</tr>
				{% endfor %}
				</tbody>
			</table>
		{% else %}
			<p class="text-muted">There are no tags.</p>
		{% endif %}
	</div>
{% endblock %}
